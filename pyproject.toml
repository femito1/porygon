[project]
name = "porygon"
version = "0.2.0"
description = "A Pokémon Showdown agent trained with self-play reinforcement learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "poke-env==0.16.1",
    "stable-baselines3==2.9.0",
    "supersuit==3.11.0",
    "torch>=2.4",
    "tensorboard>=2.17",
]

[project.optional-dependencies]
# porygon.search; must be built for gen4, see the porygon.search docstring
search = ["poke-engine>=0.0.48"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
porygon = ["data/*.json", "data/*.json.gz"]
